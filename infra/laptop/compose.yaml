# Closed pilot on one computer (docs/runbooks/laptop-pilot.md): database, malware scanner,
# app, worker and a Cloudflare quick tunnel that gives the app a public https address with
# no account. Run it through start.ps1, which fills in APP_URL from the tunnel. Settings and
# secrets live in pilot.env (git-ignored); the tunnel's address in tunnel.env.
name: creator-pilot

x-app: &app
  image: creator-platform:pilot
  init: true
  restart: unless-stopped
  env_file:
    - pilot.env
    - tunnel.env
  environment:
    APP_ENV: pilot
    # No Google/Meta apps: creators self-report YouTube and Instagram (Q-43).
    SOCIAL_PROVIDER_MODE: 'off'
    # No company or Razorpay account yet: brands pay creators directly (ADR-013).
    PAYMENTS_MODE: 'off'
    MALWARE_SCANNER: clamav
    CLAMAV_HOST: clamav
    FILE_STORAGE: local
    FILE_STORAGE_DIR: /app/storage
    # The tunnel is the one proxy in front of the app.
    TRUSTED_PROXY_HOPS: '1'
    BREACHED_PASSWORD_CHECK: hibp
    DATABASE_URL: postgresql://creator:${POSTGRES_PASSWORD:?set by start.ps1}@postgres:5432/creator_platform
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - files:/app/storage
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy

services:
  web:
    <<: *app
    build:
      context: ../..
    # next start writes its cache under .next/cache, and SWC unpacks its native binary into
    # ~/.cache, so that one mount allows exec.
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
      - /home/app/.cache:exec,mode=1777
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: ['node_modules/.bin/tsx', 'worker/index.ts']

  migrate:
    <<: *app
    profiles: [tools]
    restart: 'no'
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']

  reference-data:
    <<: *app
    profiles: [tools]
    restart: 'no'
    command: ['node_modules/.bin/tsx', 'scripts/ops/load-reference-data.ts']

  # Never published on the computer's network: only the app containers reach it.
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: creator
      POSTGRES_DB: creator_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by start.ps1}
    volumes:
      - db:/var/lib/postgresql/data
    command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'max_connections=60']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username creator --dbname creator_platform']
      interval: 10s
      timeout: 5s
      retries: 10

  # SR-9: uploads are scanned before they are stored. Needs about 1.2 GB of memory.
  clamav:
    image: clamav/clamav:1.4.6
    restart: unless-stopped

  # Public https address (*.trycloudflare.com) without a Cloudflare account. It changes
  # every time this container starts, so it never restarts on its own: start.ps1 starts it
  # and tells the app the new address.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    restart: 'no'
    command: ['tunnel', '--no-autoupdate', '--url', 'http://web:3000']

volumes:
  db:
  files:
