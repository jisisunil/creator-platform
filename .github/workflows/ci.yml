name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  APP_URL: http://localhost:3100
  DATABASE_URL: postgresql://creator:ci_password@localhost:5432/creator_platform_test
  DATABASE_URL_TEST: postgresql://creator:ci_password@localhost:5432/creator_platform_test
  LOG_LEVEL: warn
  NEXT_TELEMETRY_DISABLED: '1'
  # Throwaway CI-only secrets; real ones come from the secrets manager (SR-10).
  AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
  TOKEN_ENCRYPTION_KEY: Y2ktb25seS0zMi1ieXRlLWtleS1mb3ItdGVzdHMhISE=
  SMTP_URL: smtp://localhost:1025
  EMAIL_FROM: CI <no-reply@example.invalid>
  # Tests never call outside services.
  BREACHED_PASSWORD_CHECK: offline

jobs:
  check:
    name: Lint, types, unit + integration, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: creator_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U creator"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the npm version that understands allowScripts
        run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: npm run check (lint, format, types, unit + integration tests)
        run: npm run check
      - name: Coverage floor on domain/ and services/
        run: npm run test:coverage
      - name: Dependency audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Seed reference data and demo accounts for E2E
        run: npx prisma db seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  infra:
    name: Infrastructure (OpenTofu format and validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.7
      - run: tofu fmt -check -recursive infra
      - name: Validate each stack (no cloud access needed)
        run: |
          for stack in infra/bootstrap infra/environments/staging infra/environments/production; do
            tofu -chdir="$stack" init -backend=false -input=false
            tofu -chdir="$stack" validate
          done

  security-scan:
    name: Dependency and container scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies and config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Build image
        run: docker build -t creator-platform:ci .
      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: creator-platform:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
