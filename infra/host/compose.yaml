# Production and staging services on the server (ADR-009, ADR-010). Shipped inside the app image and
# run by deploy.sh, which writes .env (IMAGE, DOMAIN, LOG_GROUP, AWS_REGION), app.env and
# migrate.env from Parameter Store and Secrets Manager. Never edit these files on the server.
name: creator-platform

x-logging: &logging
  driver: awslogs
  options:
    awslogs-group: ${LOG_GROUP:?set by deploy.sh}
    awslogs-region: ${AWS_REGION:?set by deploy.sh}
    tag: '{{.Name}}'

x-app: &app
  image: ${IMAGE:?set by deploy.sh}
  init: true
  restart: unless-stopped
  env_file: app.env
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set by deploy.sh}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  web:
    <<: *app
    # next start writes its cache under .next/cache, and SWC (which compiles next.config.ts
    # at startup) unpacks its native binary into ~/.cache, so that one mount allows exec.
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
      - /home/app/.cache:exec,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: ['node_modules/.bin/tsx', 'worker/index.ts']
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started

  migrate:
    <<: *app
    profiles: [migrate]
    restart: 'no'
    env_file: migrate.env
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']

  # Countries, plans, privacy notices and default settings from src/config (upserts only).
  reference-data:
    <<: *app
    profiles: [migrate]
    restart: 'no'
    command: ['node_modules/.bin/tsx', 'scripts/ops/load-reference-data.ts']

  # The pilot's database (ADR-010): data and password on the server's encrypted database
  # disk (/data), reachable only on this network, backed up hourly to S3 (backup.sh).
  # Memory settings leave room for ClamAV and the app on a 4 GB server.
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: creator
      POSTGRES_DB: creator_platform
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - /data/postgres:/var/lib/postgresql/data
      - /data/secrets/postgres-password:/run/secrets/postgres-password:ro
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
      # Slow queries go to the logs, so NFR-1 regressions show up in CloudWatch.
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username creator --dbname creator_platform']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # SR-9: uploads are scanned before they are stored. Needs about 1.2 GB of memory.
  clamav:
    image: clamav/clamav:1.4.6
    restart: unless-stopped
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
