# Local development services. Never put real user data here (SR-17).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator_dev_password
      POSTGRES_DB: creator_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creator -d creator_platform']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
